    <style id="dsh-anti-flicker">
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      html[data-theme="dark"], html[data-theme="dark"] body {
        background-color: #151517 !important;
        color-scheme: dark;
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background-color: #ffffff !important;
        color-scheme: light;
      }
    </style>
    <script>
      (function() {
        // ================================================================
        // 0. 标签页与文档级独立存储键隔离（防止多画板并发在 IndexedDB 中互串）
        // ================================================================
        var _searchParams = new URLSearchParams(window.location.search);
        var _qFile = _searchParams.get("file");
        var _qTabId = _searchParams.get("tabId");
        var _qTheme = _searchParams.get("theme");

        var _tabStored = _qTabId ? localStorage.getItem("dsh_drawnix_tab_" + _qTabId) : null;
        var _globalStored = localStorage.getItem("dsh_drawnix_active_file");
        var _initialFile = _qFile || _tabStored || _globalStored;

        if (_initialFile) {
          window.__dshBoardStorageKey = "drawnix_file_" + encodeURIComponent(_initialFile);
        } else if (_qTabId) {
          window.__dshBoardStorageKey = "drawnix_tab_" + encodeURIComponent(_qTabId);
        } else {
          window.__dshBoardStorageKey = "main_board_content";
        }

        // ================================================================
        // 1. DSH 外观模式双模态同步与切换逻辑
        // ================================================================
        // 优先采纳宿主通过 URL 注入的主题（首帧 0 时差，彻底杜绝任何异步 postMessage 带来的二次跳变）
        var hostTheme = (_qTheme === "dark" || _qTheme === "light") ? _qTheme : null;
        var currentMode = localStorage.getItem("dsh_drawnix_theme_mode") || "auto";

        function computeEffectiveTheme() {
          // 明确手动偏好具有第一优先级（用户显式指定深色或浅色）
          if (currentMode === "dark" || currentMode === "light") {
            return currentMode;
          }
          // 跟随模式（auto）下，严格跟随宿主 DSH 环境的外观
          if (hostTheme === "dark" || hostTheme === "light") {
            return hostTheme;
          }
          // 兜底操作系统 prefers-color-scheme
          var isDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          return isDark ? "dark" : "light";
        }

        // 首帧在任何外部 CSS 解析前立即同步设置 HTML 根节点的 data-theme 与背景色
        var _initialTheme = computeEffectiveTheme();
        var _lastAppliedTheme = _initialTheme;
        document.documentElement.setAttribute("data-theme", _initialTheme);
        document.documentElement.style.backgroundColor = _initialTheme === "dark" ? "#151517" : "#ffffff";
        document.documentElement.style.colorScheme = _initialTheme;

        function syncBoardTheme(effectiveTheme) {
          var targetMode = (effectiveTheme === "dark") ? "dark" : "default";
          var container = document.querySelector(".plait-board-container");
          if (container) {
            container.classList.remove("theme-dark", "theme-default", "theme-colorful", "theme-soft", "theme-retro", "theme-starry");
            container.classList.add("theme-" + targetMode);
            container.style.backgroundColor = (effectiveTheme === "dark") ? "#151517" : "#ffffff";
          }
          var board = window.__dshBoard;
          if (board) {
            try {
              if (board.theme && board.theme.themeColorMode !== targetMode) {
                board.apply({
                  type: "set_theme",
                  properties: board.theme,
                  newProperties: { themeColorMode: targetMode }
                });
              }
              function traverse(node) {
                if (node.children) {
                  node.children.forEach(traverse);
                }
                if (typeof board.applyTheme === "function") {
                  board.applyTheme(node);
                }
              }
              if (board.children) {
                board.children.forEach(traverse);
              }
              if (typeof board.applyTheme === "function") {
                board.applyTheme(board);
              }
            } catch (err) {
              console.warn("[dsh-drawnix] syncBoardTheme error:", err);
            }
          }
        }
        window.__dshSyncBoardTheme = syncBoardTheme;
        window.__dshComputeEffectiveTheme = computeEffectiveTheme;

        function applyTheme() {
          var theme = computeEffectiveTheme();
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.backgroundColor = theme === "dark" ? "#151517" : "#ffffff";
          document.documentElement.style.colorScheme = theme;
          updateSwitcherUI();
          syncBoardTheme(theme);
          window.dispatchEvent(new CustomEvent("dsh-theme-changed", { detail: { mode: currentMode, effective: theme } }));
          if (theme !== _lastAppliedTheme) {
            _lastAppliedTheme = theme;
            try {
              if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: "DSH_WHITEBOARD_THEME_CHANGED", theme: theme, mode: currentMode }, "*");
              }
            } catch (e) {}
          }
        }

        var DSH_ICONS = {
          light: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" stroke-width="1.3" aria-hidden="true"><path d="M8.00007 11.8117C10.1052 11.8117 11.8117 10.1052 11.8117 8.00007C11.8117 5.89499 10.1052 4.18848 8.00007 4.18848C5.89499 4.18848 4.18848 5.89499 4.18848 8.00007C4.18848 10.1052 5.89499 11.8117 8.00007 11.8117Z" stroke="currentColor"/><path d="M13.3899 8H15.1499" stroke="currentColor"/><path d="M11.8115 11.8115L13.0556 13.0556" stroke="currentColor"/><path d="M8 13.3901V15.1501" stroke="currentColor"/><path d="M4.18868 11.8115L2.94458 13.0556" stroke="currentColor"/><path d="M2.6101 8H0.850098" stroke="currentColor"/><path d="M4.18868 4.18856L2.94458 2.94446" stroke="currentColor"/><path d="M8 2.6101V0.850098" stroke="currentColor"/><path d="M11.8115 4.18856L13.0556 2.94446" stroke="currentColor"/></svg>',
          dark: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" stroke-width="1.3" aria-hidden="true"><path d="M14.1127 8.70663C14.2576 8.60602 14.4627 8.71355 14.4386 8.88834C14.2901 9.96567 13.8731 10.9912 13.2229 11.8692C12.479 12.8735 11.4613 13.6421 10.2917 14.0829C9.1222 14.5236 7.85038 14.6179 6.62865 14.3543C5.40692 14.0907 4.28709 13.4805 3.40332 12.5967C2.51955 11.7129 1.90931 10.5931 1.64572 9.37135C1.38212 8.14962 1.47635 6.87779 1.91711 5.70825C2.35787 4.5387 3.12647 3.52103 4.13083 2.77714C5.00878 2.12689 6.03433 1.70994 7.11166 1.5614C7.28645 1.5373 7.39397 1.74238 7.29337 1.88734C6.68703 2.76099 6.37885 3.81241 6.42313 4.88345C6.47392 6.11194 6.98471 7.27645 7.85413 8.14587C8.72355 9.01529 9.88805 9.52608 11.1166 9.57687C12.1876 9.62114 13.239 9.31296 14.1127 8.70663Z" stroke="currentColor"/></svg>',
          auto: '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" stroke-width="1.3" aria-hidden="true"><path d="M13.5 2.5H2.5C1.94772 2.5 1.5 2.94772 1.5 3.5V11.5C1.5 12.0523 1.94772 12.5 2.5 12.5H13.5C14.0523 12.5 14.5 12.0523 14.5 11.5V3.5C14.5 2.94772 14.0523 2.5 13.5 2.5Z" stroke="currentColor"/><path d="M5 14.5H11" stroke="currentColor"/></svg>'
        };
        var DSH_TEXTS = {
          auto: "自动",
          dark: "深色",
          light: "浅色"
        };

        function updateSwitcherUI() {
          var iconEl = document.getElementById("dsh-theme-icon");
          var textEl = document.getElementById("dsh-theme-text");
          if (iconEl) iconEl.innerHTML = DSH_ICONS[currentMode] || DSH_ICONS.auto;
          if (textEl) textEl.textContent = DSH_TEXTS[currentMode] || "自动";

          var opts = document.querySelectorAll(".dsh-theme-opt");
          for (var i = 0; i < opts.length; i++) {
            var opt = opts[i];
            if (opt.getAttribute("data-mode") === currentMode) {
              opt.classList.add("active");
            } else {
              opt.classList.remove("active");
            }
          }
        }

        window.__setThemeMode = function(mode) {
          currentMode = mode;
          localStorage.setItem("dsh_drawnix_theme_mode", mode);
          applyTheme();
        };

        // 初始立即生效主题
        applyTheme();

        // 监听来自宿主环境的主题广播
        window.addEventListener("message", function(event) {
          if (event.data && event.data.type === "DSH_THEME_CHANGE" && event.data.theme) {
            hostTheme = event.data.theme;
            applyTheme();
          }
        });

        // 监听操作系统颜色方案变更
        try {
          var mql = window.matchMedia("(prefers-color-scheme: dark)");
          var mqlHandler = function() {
            if (currentMode === "auto") applyTheme();
          };
          mql.addEventListener ? mql.addEventListener("change", mqlHandler) : mql.addListener(mqlHandler);
        } catch (e) {}

        // 历史数据修复
        try {
          if (window.indexedDB) {
            var dbReq = indexedDB.open("Drawnix");
            dbReq.onsuccess = function(e) {
              var db = e.target.result;
              if (db.objectStoreNames.contains("drawnix_store")) {
                var tx = db.transaction("drawnix_store", "readwrite");
                var store = tx.objectStore("drawnix_store");
                var getReq = store.get("main_board_content");
                getReq.onsuccess = function() {
                  var data = getReq.result;
                  if (data && data.theme && data.theme.themeColorMode === "dark") {
                    delete data.theme;
                    store.put(data, "main_board_content");
                    console.log("[dsh-drawnix] Auto-healed legacy dark themeColorMode");
                  }
                };
              }
            };
          }
        } catch (err) {}
      })();
    </script>

            </svg>

          <hr class="dsh-doc-divider"/>

          <!-- 4. 删除当前画板 (危险破坏性动作置底，红字) -->

              <path d="M6.5 7.5V11M9.5 7.5V11"/>

    <!-- 二级子菜单面板 (与一级菜单平级独立渲染在 body 根级，获得 100% 同款高质量通透毛玻璃效果) -->
    <div id="dsh-submenu-more" class="dsh-doc-submenu">

      <hr class="dsh-doc-divider"/>

      <!-- 导出组：导出文件与图片 -->
      <div id="dsh-act-export" class="dsh-doc-action-opt">

        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">

    <!-- 隐藏的本地导入文件控件 -->
    <input type="file" id="dsh-file-input" accept=".drawnix,.json" style="display:none" />

    <!-- 新建/另存为弹窗对话框 -->
    <div id="dsh-modal-backdrop" class="dsh-modal-backdrop">
      <div class="dsh-modal-card">
        <h3 id="dsh-modal-title" class="dsh-modal-title">新建画板文件</h3>
        <div class="dsh-modal-input-wrap">
          <input type="text" id="dsh-modal-input" class="dsh-modal-input" placeholder="例如: 架构设计" />
          <span class="dsh-modal-suffix">.drawnix</span>
        </div>
        <div id="dsh-modal-options" class="dsh-modal-options">
          <label class="dsh-modal-radio-label">
            <input type="radio" name="dsh-modal-type" value="blank" checked />
            <span>创建空白新画板</span>
          </label>
          <label class="dsh-modal-radio-label">
            <input type="radio" name="dsh-modal-type" value="copy" />
            <span>复制当前画板内容</span>
          </label>
        </div>
        <div class="dsh-modal-footer">
          <button id="dsh-modal-cancel" class="dsh-btn dsh-btn-secondary">取消</button>
          <button id="dsh-modal-confirm" class="dsh-btn dsh-btn-primary">确认创建</button>
        </div>
      </div>
    </div>

    <!-- 删除确认弹窗 -->
    <div id="dsh-delete-modal-backdrop" class="dsh-modal-backdrop">
      <div class="dsh-modal-card">
        <h3 class="dsh-modal-title" style="color:#ff6b6b;display:flex;align-items:center;gap:6px;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M3 4.5H13M6 4.5V2.5C6 2.22386 6.22386 2 6.5 2H9.5C9.77614 2 10 2.22386 10 2.5V4.5M4.5 4.5V13C4.5 13.5523 4.94772 14 5.5 14H10.5C11.0523 14 11.5 13.5523 11.5 13V4.5"/>
          </svg>
          删除画板确认
        </h3>
        <p style="font-size:13px;color:var(--dsw-text-secondary);line-height:1.5;margin:0;">
          确定要从白板库永久删除画板 <strong id="dsh-delete-target-name" style="color:var(--dsw-text-primary);"></strong> 吗？此操作无法撤销。
        </p>
        <div class="dsh-modal-footer">
          <button id="dsh-delete-modal-cancel" class="dsh-btn dsh-btn-secondary">取消</button>
          <button id="dsh-delete-modal-confirm" class="dsh-btn dsh-btn-danger">确认删除</button>
        </div>
      </div>
    </div>

    <!-- 清空画布确认弹窗 -->
    <div id="dsh-clear-modal-backdrop" class="dsh-modal-backdrop">
      <div class="dsh-modal-card">
        <h3 class="dsh-modal-title" style="color:#fcc419;display:flex;align-items:center;gap:6px;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
            <path d="M8 2.5L1.5 13.5H14.5L8 2.5Z"/>
            <path d="M8 6.5V9.5M8 11.5H8.01"/>
          </svg>
          清空画布确认
        </h3>
        <p style="font-size:13px;color:var(--dsw-text-secondary);line-height:1.5;margin:0;">
          确定要清空当前画板上的所有图形和内容吗？当前画布将被重置为空白状态。
        </p>
        <div class="dsh-modal-footer">
          <button id="dsh-clear-modal-cancel" class="dsh-btn dsh-btn-secondary">取消</button>
          <button id="dsh-clear-modal-confirm" class="dsh-btn dsh-btn-warning">确认清空</button>
        </div>
      </div>
    </div>



    <!-- ================================================================
         4. 前端工作区多文档与自动保存联动引擎
         ================================================================ -->
    <script>
      (function() {
        var searchParams = new URLSearchParams(window.location.search);
        var queryFile = searchParams.get("file");
        var currentTabId = searchParams.get("tabId") || "";
        var tabCachedFile = currentTabId ? localStorage.getItem("dsh_drawnix_tab_" + currentTabId) : null;
        var globalCachedFile = localStorage.getItem("dsh_drawnix_active_file");
        var activeFilePath = queryFile || tabCachedFile || globalCachedFile || null;
        var currentBoardContent = null;
        var currentWorkspace = null;
        var allWorkspaces = [];
        var fileList = [];
        var isFileLoaded = false;
        var currentFileMtime = null;
        var lastSavedJson = null;
        var saveTimer = null;
        var pendingSavePath = null;
        var pendingSaveData = null;
        var pendingModalAction = "new";
        var pendingImportData = null;
        var selectFileSeq = 0;
        var loadingFilePath = null;
        var lastHandledOpenSeq = 0;

        // 防御性桥接：拦截并挂载 React 内部暴露的 __dshLoadBoardData
        // 彻底杜绝冷启动时网络请求快于 React Bundle 解析完成导致的白板内容加载丢失或竞态倒退
        var _rawLoadBoardData = window.__dshLoadBoardData;
        var lastAppliedBoardContent = null;
        window.__dshPendingBoardContent = null;

        // 把内容放上画板。画板上已经是这份内容（已应用过，或元素完全相同——例如刚从本地缓存挂载）时什么都不做：
        // __dshLoadBoardData 会整块重建画板，界面会「显示 → 消失 → 再显示」地闪一下
        function applyBoardContent(content) {
          if (!content || content === lastAppliedBoardContent) return;
          var shown = typeof window.__dshGetBoardData === "function" ? window.__dshGetBoardData() : null;
          try {
            if (shown && shown.children && shown.children.length > 0 && content.children &&
                JSON.stringify(shown.children) === JSON.stringify(content.children)) {
              lastAppliedBoardContent = content;
              return;
            }
          } catch (e) {}
          if (typeof _rawLoadBoardData === "function") _rawLoadBoardData(content);
        }

        try {
          Object.defineProperty(window, "__dshLoadBoardData", {
            configurable: true,
            enumerable: true,
            get: function() {
              return _rawLoadBoardData;
            },
            set: function(fn) {
              _rawLoadBoardData = function(data) {
                lastAppliedBoardContent = data;
                var res = typeof fn === "function" ? fn(data) : undefined;
                setTimeout(function() {
                  if (window.__dshSyncBoardTheme) {
                    window.__dshSyncBoardTheme(window.__dshComputeEffectiveTheme ? window.__dshComputeEffectiveTheme() : "dark");
                  }
                }, 40);
                return res;
              };
              if (typeof fn === "function" && window.__dshPendingBoardContent) {
                var pending = window.__dshPendingBoardContent;
                window.__dshPendingBoardContent = null;
                setTimeout(function() {
                  try {
                    applyBoardContent(pending);
                  } catch (err) {
                    console.warn("[dsh-drawnix] 挂载未决画板数据出错:", err);
                  }
                }, 30);
              }
            }
          });
        } catch (e) {}

        // DOM 引用
        var switcherEl = document.getElementById("dsh-doc-switcher");
        window.__dshDocSwitcherEl = switcherEl;
        var docBtn = document.getElementById("dsh-doc-btn");
        var docDropdown = document.getElementById("dsh-doc-dropdown");
        var docTitle = document.getElementById("dsh-doc-title");
        var docDot = document.getElementById("dsh-doc-dot");
        var docListEl = document.getElementById("dsh-doc-list");
        var wsTitleEl = document.getElementById("dsh-ws-title");
        var wsPathEl = document.getElementById("dsh-ws-path");
        var refreshBtn = document.getElementById("dsh-doc-refresh");

        window.__dshGetActiveFileName = function() {
          var t = (docTitle ? docTitle.textContent : "").trim();
          return t.replace(/\.drawnix$/i, "") || "whiteboard";
        };

        var actNew = document.getElementById("dsh-act-new");
        var actSaveAs = document.getElementById("dsh-act-saveas");
        var actExport = document.getElementById("dsh-act-export");
        var actImport = document.getElementById("dsh-act-import");
        var fileInput = document.getElementById("dsh-file-input");

        var modalBackdrop = document.getElementById("dsh-modal-backdrop");
        var modalTitle = document.getElementById("dsh-modal-title");
        var modalInput = document.getElementById("dsh-modal-input");
        var modalOptions = document.getElementById("dsh-modal-options");
        var modalCancel = document.getElementById("dsh-modal-cancel");
        var modalConfirm = document.getElementById("dsh-modal-confirm");


        // 写入本地 IndexedDB 缓存
        function saveToIndexedDB(content) {
          try {
            if (window.indexedDB) {
              var req = indexedDB.open("Drawnix");
              req.onsuccess = function(e) {
                var db = e.target.result;
                if (db.objectStoreNames.contains("drawnix_store")) {
                  var tx = db.transaction("drawnix_store", "readwrite");
                  var store = tx.objectStore("drawnix_store");
                  var doc = content || { children: [] };
                  if (doc.elements && !doc.children) doc.children = doc.elements;
                  var sKey = window.__dshBoardStorageKey || "main_board_content";
                  store.put(doc, sKey);
                }
              };
            }
          } catch (e) {}
        }

        // 立即刷新保存未决的变更，避免切换文件时上一文件的修改意外保存到新文件中
        function flushPendingSave() {
          if (saveTimer) {
            clearTimeout(saveTimer);
            saveTimer = null;
            if (pendingSavePath && pendingSaveData && isFileLoaded) {
              var sPath = pendingSavePath;
              var sData = pendingSaveData;
              pendingSavePath = null;
              pendingSaveData = null;
              var sJson = JSON.stringify(sData);
              if (lastSavedJson && sJson === lastSavedJson) return;
              lastSavedJson = sJson;
              fetch("/drawnix/api/save", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ path: sPath, content: sData, mtime: currentFileMtime })
              })
              .then(function(r) { return r.json(); })
              .then(function(res) {
                if (res && res.mtime) currentFileMtime = res.mtime;
              })
              .catch(function(err) {
                console.warn("[dsh-drawnix] 切换文件前保存旧文件失败:", err);
              });
            }
          }
        }

        // 渲染下拉菜单中的文件清单
        function renderFileList() {
          if (!docListEl) return;
          if (fileList.length === 0) {
            docListEl.innerHTML = '<div class="dsh-doc-list-empty">白板库暂无画板，点击下方新建</div>';
            return;
          }

          var html = "";
          for (var i = 0; i < fileList.length; i++) {
            var file = fileList[i];
            var isActive = activeFilePath === file.path;
            html += '<div class="dsh-doc-item ' + (isActive ? "active" : "") + '" data-path="' + file.path + '">';
            html += '  <div class="dsh-doc-item-main">';
            html += '    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" style="flex-shrink:0">';
            html += '      <path d="M3 2.5C3 1.94772 3.44772 1.5 4 1.5H9.5L13 5V13.5C13 14.0523 12.5523 14.5 12 14.5H4C3.44772 14.5 3 14.0523 3 13.5V2.5Z"/>';
            html += '      <path d="M9 1.5V5.5H13"/>';
            html += '    </svg>';
            html += '    <span class="dsh-doc-item-title" title="' + (file.path || file.relativePath) + '">' + file.name + '</span>';
            html += '  </div>';
            html += '  <div class="dsh-doc-item-right">';
            if (isActive) {
              html += '    <span class="dsh-doc-item-check">✓</span>';
            }
            html += '  </div>';
            html += '</div>';
          }
          docListEl.innerHTML = html;

          var items = docListEl.querySelectorAll(".dsh-doc-item");
          items.forEach(function(item) {
            item.addEventListener("click", function(e) {
              e.stopPropagation();
              var path = item.getAttribute("data-path");
              if (path === activeFilePath && isFileLoaded) {
                docDropdown.classList.remove("open");
                return;
              }
              selectFile(path, true, true);
              docDropdown.classList.remove("open");
            });
          });
        }

        // 查找文件列表中匹配项（支持相对路径、绝对路径、文件名匹配）
        function findInFileList(p) {
          if (!p) return null;
          var target = decodeURIComponent(p).replace(/\\/g, "/");
          var base = target.split("/").pop();
          for (var i = 0; i < fileList.length; i++) {
            var f = fileList[i];
            if (f.path === target || f.relativePath === target || f.name === target || f.name === base) {
              return f;
            }
            if (f.path && f.path.endsWith("/" + base)) {
              return f;
            }
          }
          return null;
        }

        // 选中并加载文件
        function selectFile(filePath, loadImmediately, force) {
          if (!filePath) return;
          if (loadImmediately === undefined) loadImmediately = true;
          if (activeFilePath === filePath && isFileLoaded && !force) return;

          // 关键防护：在切换新文件前，优先将上一画板文件的未决自动保存提交磁盘
          flushPendingSave();

          activeFilePath = filePath;
          window.__dshBoardStorageKey = "drawnix_file_" + encodeURIComponent(filePath);
          isFileLoaded = false;
          localStorage.setItem("dsh_drawnix_active_file", filePath);
          if (currentTabId) {
            localStorage.setItem("dsh_drawnix_tab_" + currentTabId, filePath);
          }
          var file = findInFileList(filePath);
          var fileName = file ? file.name : (filePath ? filePath.replace(/\\/g, "/").split("/").pop() : "白板");

          if (docTitle) docTitle.textContent = fileName;
          if (docDot) {
            docDot.className = "dsh-doc-status-dot";
            docDot.title = "已同步工作区文件: " + filePath;
          }
          renderFileList();
          if (typeof mountDocSwitcherToSlot === "function") {
            mountDocSwitcherToSlot();
          }

          // 向宿主窗口发送广播，实时同步宿主侧栏 Tab 标签标题（携带专属 tabId 严格隔离）
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({
                type: "DSH_WHITEBOARD_ACTIVE_FILE_CHANGED",
                path: filePath,
                name: fileName,
                tabId: currentTabId
              }, "*");
            }
          } catch (e) {}

          // 快速连续切换时，只认最后一次请求的结果，避免旧文件晚返回覆盖新文件
          var loadSeq = ++selectFileSeq;
          loadingFilePath = filePath;
          fetch("/drawnix/api/file?path=" + encodeURIComponent(filePath))
            .then(function(r) {
              if (loadSeq !== selectFileSeq) return null;
              if (!r.ok) {
                return r.json().then(function(errData) {
                  var error = new Error(errData.error || ("HTTP " + r.status));
                  error.status = r.status;
                  error.data = errData;
                  throw error;
                });
              }
              return r.json();
            })
            .then(function(res) {
              if (loadSeq !== selectFileSeq) return;
              loadingFilePath = null;
              if (res && res.content) {
                if (res.path) {
                  activeFilePath = res.path;
                  window.__dshBoardStorageKey = "drawnix_file_" + encodeURIComponent(res.path);
                  localStorage.setItem("dsh_drawnix_active_file", res.path);
                  if (currentTabId) {
                    localStorage.setItem("dsh_drawnix_tab_" + currentTabId, res.path);
                  }
                }
                if (res.name && docTitle) {
                  docTitle.textContent = res.name;
                }
                var content = res.content;
                // 关键点：根据当前有效主题同步校准文档的 themeColorMode，避免载入带旧深色标记的文档时画布在浅色模式下闪现深色
                // computeEffectiveTheme 定义在上方另一个 <script> 的闭包里，这里只能通过 window 暴露的版本访问
                var effTheme = typeof window.__dshComputeEffectiveTheme === "function"
                  ? window.__dshComputeEffectiveTheme()
                  : (document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light");
                var targetThemeColorMode = (effTheme === "dark") ? "dark" : "default";
                if (content) {
                  if (!content.theme) {
                    content.theme = { themeColorMode: targetThemeColorMode };
                  } else {
                    content.theme.themeColorMode = targetThemeColorMode;
                  }
                }
                currentBoardContent = content;
                currentFileMtime = res.mtime || null;
                lastSavedJson = JSON.stringify(content);
                isFileLoaded = true;
                saveToIndexedDB(content);
                if (loadImmediately) {
                  if (typeof window.__dshLoadBoardData === "function") {
                    window.__dshPendingBoardContent = null;
                    applyBoardContent(content);
                  } else {
                    window.__dshPendingBoardContent = content;
                  }
                }
                setTimeout(function() {
                  if (typeof mountDocSwitcherToSlot === "function") {
                    mountDocSwitcherToSlot();
                  }
                }, 60);

                // 若外部打开的文件尚未收录在下拉列表中，立即加入列表并异步刷新工作区文件
                if (!file) {
                  fileList.unshift({
                    name: res.name || (res.path ? res.path.split("/").pop() : "白板"),
                    path: res.path,
                    relativePath: res.name || (res.path ? res.path.split("/").pop() : "白板"),
                    size: 0,
                    mtime: res.mtime || Date.now(),
                  });
                  renderFileList();
                  loadWorkspaceAndFiles();
                }
              }
            })
            .catch(function(err) {
              if (loadSeq !== selectFileSeq) return;
              loadingFilePath = null;
              console.error("[dsh-drawnix] 读取画板文件失败:", err);
              isFileLoaded = false;
              pendingSavePath = null;
              pendingSaveData = null;
              if (docDot) {
                docDot.className = "dsh-doc-status-dot offline";
                docDot.title = (err.data && err.data.corrupted ? "【文件损坏拦截】" : "【加载失败】") + err.message + "，已自动阻止保存原文件以防覆盖！";
              }
              if (docTitle) {
                docTitle.textContent = (fileName || "白板") + " (加载失败)";
              }
            });
        }

        // 若启动时已有目标画板路径（URL 参数、Tab 缓存或活跃记录），立即发起加载
        if (activeFilePath) {
          selectFile(activeFilePath, true);
        }

        // 加载统一白板库与画板文件列表
        function loadWorkspaceAndFiles(callback) {
          Promise.all([
            fetch("/drawnix/api/workspace").then(function(r) { return r.json(); }).catch(function() { return null; }),
            fetch("/drawnix/api/files").then(function(r) { return r.json(); }).catch(function() { return null; })
          ]).then(function(results) {
            var wsData = results[0];
            var filesData = results[1];

            if (wsData && wsData.current) {
              currentWorkspace = wsData.current;
              if (wsTitleEl) {
                wsTitleEl.textContent = currentWorkspace.title || "我的白板库";
              }
              if (wsPathEl) {
                wsPathEl.textContent = currentWorkspace.displayPath || "~/.dsh/whiteboards";
                wsPathEl.title = currentWorkspace.path || "";
              }
            }

            if (filesData && filesData.files) {
              fileList = filesData.files;
            }

            // 如果当前文件尚未加载完毕，自动载入指定画板或白板库中的第一个画板
            if (!isFileLoaded) {
              var targetToLoad = activeFilePath || (fileList.length > 0 ? fileList[0].path : null);
              if (targetToLoad) {
                selectFile(targetToLoad, true, true);
              }
            }
            renderFileList();

            if (callback) callback();
          });
        }

        // 挂载核心画布变动拦截钩子（由 Drawnix onChange 调用）
        window.__dshOnCanvasChange = function(newData) {
          if (!isFileLoaded) {
            // 画布初始化初次挂载时可能触发内部 onChange，此时文件尚未完成首次载入，绝对禁止写入磁盘！
            return;
          }
          var newJson = JSON.stringify(newData);
          if (lastSavedJson && newJson === lastSavedJson) {
            // 内容与磁盘中读取的数据完全一致（无用户实质改动），跳过自动保存
            return;
          }

          if (docDot) {
            docDot.className = "dsh-doc-status-dot saving";
            docDot.title = "正在自动保存变更...";
          }

          // 记录变动发生时的文件路径与内容快照，防止异步防抖期间切换文件导致文件串色写入
          pendingSavePath = activeFilePath;
          pendingSaveData = newData;

          if (saveTimer) clearTimeout(saveTimer);
          saveTimer = setTimeout(function() {
            saveTimer = null;
            var targetPath = pendingSavePath;
            var targetData = pendingSaveData;
            pendingSavePath = null;
            pendingSaveData = null;

            if (targetPath) {
              fetch("/drawnix/api/save", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({
                  path: targetPath,
                  content: targetData,
                  mtime: currentFileMtime,
                })
              })
              .then(function(r) {
                if (!r.ok) {
                  return r.json().then(function(errData) {
                    var err = new Error(errData.error || ("HTTP " + r.status));
                    err.status = r.status;
                    err.data = errData;
                    throw err;
                  });
                }
                return r.json();
              })
              .then(function(res) {
                if (res.success && docDot && activeFilePath === targetPath) {
                  if (res.mtime) currentFileMtime = res.mtime;
                  lastSavedJson = JSON.stringify(targetData);
                  docDot.className = "dsh-doc-status-dot";
                  docDot.title = "已同步工作区文件: " + targetPath;
                }
              })
              .catch(function(err) {
                console.warn("[dsh-drawnix] 自动保存失败:", err);
                if (docDot && activeFilePath === targetPath) {
                  docDot.className = "dsh-doc-status-dot offline";
                  if (err.status === 409) {
                    docDot.title = "【并发冲突】" + err.message;
                  } else {
                    docDot.title = "保存失败: " + err.message;
                  }
                }
              });
            } else {
              if (docDot) {
                docDot.className = "dsh-doc-status-dot offline";
                docDot.title = "未绑定文件，已存入本地缓存";
              }
            }
          }, 600);
        };

        // 供宿主在卸载 iframe 前同步取走未决的自动保存（iframe 被移除后定时器不会再触发），由宿主代为写盘
        window.__dshTakePendingSave = function() {
          if (!saveTimer || !pendingSavePath || !pendingSaveData || !isFileLoaded) return null;
          clearTimeout(saveTimer);
          saveTimer = null;
          var taken = { path: pendingSavePath, content: pendingSaveData, mtime: currentFileMtime };
          pendingSavePath = null;
          pendingSaveData = null;
          return taken;
        };

        function sanitizeDisplayName(name) {
          if (!name) return "";
          return name.replace(/\.drawnix(\.json)?$/i, "");
        }

        // 弹窗处理逻辑
        function openModal(action, defaultName) {
          pendingModalAction = action;
          var curRaw = (docTitle ? docTitle.textContent : "架构设计");
          var cleanName = sanitizeDisplayName(defaultName || curRaw);
          if (cleanName === "未命名白板" || cleanName.indexOf("未命名") !== -1) {
            cleanName = "架构设计";
          }

          if (action === "new") {
            modalTitle.textContent = "新建画板文件";
            modalInput.value = cleanName;
            modalOptions.style.display = "flex";
            modalConfirm.textContent = "确认创建";
          } else if (action === "saveas") {
            modalTitle.textContent = "创建画板副本";
            modalInput.value = cleanName + "-副本";
            modalOptions.style.display = "none";
            modalConfirm.textContent = "确认创建";
          } else if (action === "rename") {
            modalTitle.textContent = "重命名画板文件";
            modalInput.value = cleanName;
            modalOptions.style.display = "none";
            modalConfirm.textContent = "确认重命名";
          } else if (action === "save_draft") {
            modalTitle.textContent = "命名并保存到白板库";
            modalInput.value = cleanName;
            modalOptions.style.display = "none";
            modalConfirm.textContent = "保存到白板库";
          } else if (action === "import") {
            modalTitle.textContent = "导入画板到白板库";
            modalInput.value = cleanName;
            modalOptions.style.display = "none";
            modalConfirm.textContent = "确认导入并打开";
          }
          modalBackdrop.classList.add("open");
          modalInput.focus();
          modalInput.select();
        }

        function closeModal() {
          modalBackdrop.classList.remove("open");
          pendingImportData = null;
        }

        function handleModalConfirm() {
          var rawVal = modalInput.value.trim();
          var baseName = sanitizeDisplayName(rawVal) || "未命名画板";
          var fullFileName = baseName + ".drawnix";

          var wsDir = (currentWorkspace && currentWorkspace.path) ? currentWorkspace.path : "";

          // 0. 处理导入外部画板流程
          if (pendingModalAction === "import") {
            fetch("/drawnix/api/create", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                workspace: wsDir,
                filename: fullFileName,
                content: pendingImportData
              })
            })
            .then(function(r) {
              if (!r.ok) {
                var err = new Error("HTTP " + r.status);
                err.status = r.status;
                throw err;
              }
              return r.json();
            })
            .then(function(res) {
              if (res.success) {
                closeModal();
                loadWorkspaceAndFiles(function() {
                  selectFile(res.path, true);
                });
              } else {
                alert("导入失败: " + (res.error || "未知原因"));
              }
            })
            .catch(function(err) {
              if (err.status === 405) {
                closeModal();
                if (docTitle) docTitle.textContent = fullFileName;
                saveToIndexedDB(pendingImportData);
                alert("【本地已导入画板：" + fullFileName + "】\n\n提示：检测到当前 DeepSeek Harness 后台仍在运行旧进程（405）。\n请完全退出并重启一次 DSH 应用（Command+Q 后重新打开），后台文件落盘服务即可激活！导入内容已安全保存在本地缓存中。");
                return;
              }
              alert("导入请求出错: " + err.message);
            });
            return;
          }

          // 1. 处理重命名流程
          if (pendingModalAction === "rename") {
            if (!activeFilePath) return;
            fetch("/drawnix/api/rename", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                oldPath: activeFilePath,
                newName: fullFileName
              })
            })
            .then(function(r) {
              if (!r.ok) {
                var err = new Error("HTTP " + r.status);
                err.status = r.status;
                throw err;
              }
              return r.json();
            })
            .then(function(res) {
              if (res.success) {
                closeModal();
                activeFilePath = res.newPath;
                localStorage.setItem("dsh_drawnix_active_file", res.newPath);
                if (currentTabId) {
                  localStorage.setItem("dsh_drawnix_tab_" + currentTabId, res.newPath);
                }
                if (docTitle) docTitle.textContent = res.name;
                loadWorkspaceAndFiles();
              } else {
                alert("重命名失败: " + (res.error || "未知原因"));
              }
            })
            .catch(function(err) {
              if (err.status === 405) {
                closeModal();
                if (docTitle) docTitle.textContent = fullFileName;
                saveToIndexedDB(window.__dshGetBoardData ? window.__dshGetBoardData() : null);
                alert("【本地已重命名为：" + fullFileName + "】\n\n提示：检测到当前 DeepSeek Harness 后台仍在运行旧进程（405）。\n请完全退出并重启一次 DSH 应用（Command+Q 后重新打开），后台文件同步服务即可激活！当前绘制内容已保存在本地缓存中。");
                return;
              }
              alert("请求出错: " + err.message);
            });
            return;
          }

          // 2. 处理草稿初次命名保存流程
          if (pendingModalAction === "save_draft") {
            var draftContent = window.__dshGetBoardData ? window.__dshGetBoardData() : null;
            fetch("/drawnix/api/create", {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                workspace: wsDir,
                filename: fullFileName,
                content: draftContent
              })
            })
            .then(function(r) {
              if (!r.ok) {
                var err = new Error("HTTP " + r.status);
                err.status = r.status;
                throw err;
              }
              return r.json();
            })
            .then(function(res) {
              if (res.success) {
                closeModal();
                loadWorkspaceAndFiles(function() {
                  selectFile(res.path, false);
                });
              } else {
                alert("保存失败: " + (res.error || "未知原因"));
              }
            })
            .catch(function(err) {
              if (err.status === 405) {
                closeModal();
                if (docTitle) docTitle.textContent = fullFileName;
                saveToIndexedDB(draftContent || (window.__dshGetBoardData ? window.__dshGetBoardData() : null));
                alert("【本地已命名为：" + fullFileName + "】\n\n提示：检测到当前 DeepSeek Harness 后台仍在运行旧进程（405）。\n请完全退出并重启一次 DSH 应用（Command+Q 后重新打开），后台文件落盘服务即可激活！当前绘制内容已安全保存在本地缓存中。");
                return;
              }
              alert("请求出错: " + err.message);
            });
            return;
          }

          // 3. 处理新建与另存为流程
          var content = null;

          if (pendingModalAction === "new") {
            var radios = document.getElementsByName("dsh-modal-type");
            var isCopy = false;
            for (var i = 0; i < radios.length; i++) {
              if (radios[i].checked && radios[i].value === "copy") isCopy = true;
            }
            if (isCopy && window.__dshGetBoardData) {
              content = window.__dshGetBoardData();
            }
          } else {
            if (window.__dshGetBoardData) {
              content = window.__dshGetBoardData();
            }
          }

          fetch("/drawnix/api/create", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              workspace: wsDir,
              filename: fullFileName,
              content: content
            })
          })
          .then(function(r) {
            if (!r.ok) {
              var err = new Error("HTTP " + r.status);
              err.status = r.status;
              throw err;
            }
            return r.json();
          })
          .then(function(res) {
            if (res.success) {
              closeModal();
              loadWorkspaceAndFiles(function() {
                selectFile(res.path, true);
              });
            } else {
              alert("创建失败: " + (res.error || "未知原因"));
            }
          })
          .catch(function(err) {
            if (err.status === 405) {
              closeModal();
              if (docTitle) docTitle.textContent = fullFileName;
              saveToIndexedDB(content || (window.__dshGetBoardData ? window.__dshGetBoardData() : null));
              alert("【本地已创建画板：" + fullFileName + "】\n\n提示：检测到当前 DeepSeek Harness 后台仍在运行旧进程（405）。\n请完全退出并重启一次 DSH 应用（Command+Q 后重新打开），即可将此画板正式写为本地物理文件！");
              return;
            }
            alert("请求出错: " + err.message);
          });
        }

        // 导出画板
        function exportBoard() {
          var data = window.__dshGetBoardData ? window.__dshGetBoardData() : null;
          if (!data) return;
          var jsonStr = JSON.stringify(data, null, 2);
          var blob = new Blob([jsonStr], { type: "application/json" });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          var fname = (docTitle ? docTitle.textContent : "whiteboard").replace(/\.drawnix$/, "") + ".drawnix";
          a.href = url;
          a.download = fname;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }

        function updateDocDropdownPosition() {
          if (!docBtn || !docDropdown) return;
          var rect = docBtn.getBoundingClientRect();
          var top = rect.bottom + 8;
          var left = rect.left;
          var menuWidth = 280;
          if (left + menuWidth > window.innerWidth - 8) {
            left = Math.max(8, window.innerWidth - menuWidth - 8);
          }
          docDropdown.style.top = top + "px";
          docDropdown.style.left = left + "px";
        }

        // 自动挂载文档管理组件至左上角一体化胶囊槽位 (#dsh-doc-slot 或 .app-toolbar .stack)
        function mountDocSwitcherToSlot() {
          var switcher = window.__dshDocSwitcherEl || document.getElementById("dsh-doc-switcher");
          if (!switcher) return;

          // 保持下拉菜单与二级子菜单挂载在 body 根级（独立于 .island 容器，获得 100% 完整的毛玻璃通透采样）
          var dropdown = document.getElementById("dsh-doc-dropdown");
          if (dropdown && dropdown.parentNode !== document.body) {
            document.body.appendChild(dropdown);
          }
          var submenu = document.getElementById("dsh-submenu-more");
          if (submenu && submenu.parentNode !== document.body) {
            document.body.appendChild(submenu);
          }

          // 1. 优先挂载至预留槽位 (#dsh-doc-slot)
          var slot = document.getElementById("dsh-doc-slot");
          if (slot) {
            if (switcher.parentNode !== slot) {
              slot.appendChild(switcher);
            }
            return;
          }

          // 2. 兜底：直接挂载至 .app-toolbar .stack 中汉堡菜单按钮之后
          var stack = document.querySelector(".drawnix .app-toolbar .stack, .app-toolbar .stack");
          if (stack && stack.children.length >= 1) {
            var menuNode = stack.children[0];
            if (menuNode && menuNode.nextElementSibling !== switcher) {
              menuNode.after(switcher);
            }
          }
        }

        window.__dshMountDocSwitcher = mountDocSwitcherToSlot;
        window.__dshOnBoardInit = function(board) {
          mountDocSwitcherToSlot();
          if (window.__dshSyncBoardTheme) {
            window.__dshSyncBoardTheme(window.__dshComputeEffectiveTheme ? window.__dshComputeEffectiveTheme() : "dark");
          }
          // 若之前网络请求返回早于 React 白板初始化，在此刻安全消费未决数据并刷新画布
          // 注意：__dshLoadBoardData 会让画板重挂载并再次触发 afterInit -> 本函数，
          // 因此已经应用到画板的内容不能再加载，否则会无限循环（React #185）
          var toLoad = window.__dshPendingBoardContent || currentBoardContent;
          if (toLoad && toLoad !== lastAppliedBoardContent && typeof window.__dshLoadBoardData === "function") {
            window.__dshPendingBoardContent = null;
            try {
              applyBoardContent(toLoad);
            } catch (err) {
              console.warn("[dsh-drawnix] afterInit 挂载未决画板数据出错:", err);
            }
          }
        };

        // 初始化交互事件
        function initApp() {
          mountDocSwitcherToSlot();
          var slotTimer = setInterval(function() {
            var slot = document.getElementById("dsh-doc-slot");
            var switcher = window.__dshDocSwitcherEl || document.getElementById("dsh-doc-switcher");
            if (slot && switcher && switcher.parentNode !== slot) {
              mountDocSwitcherToSlot();
            }
          }, 200);

          var slotObserver = new MutationObserver(function() {
            mountDocSwitcherToSlot();
          });
          slotObserver.observe(document.body, { childList: true, subtree: true });

          // 初始化文档管理按钮
          if (docBtn && docDropdown) {
            docBtn.addEventListener("click", function(e) {
              e.stopPropagation();
              updateRenameMenuText();
              updateDocDropdownPosition();
              docDropdown.classList.toggle("open");
            });

            window.addEventListener("resize", function() {
              if (docDropdown.classList.contains("open")) {
                updateDocDropdownPosition();
              }
            });
          }

          function closeAllDocDropdowns() {
            if (docDropdown) docDropdown.classList.remove("open");
            var actMoreEl = document.getElementById("dsh-act-more");
            if (actMoreEl) actMoreEl.classList.remove("dsh-submenu-active");
            var submenuMoreEl = document.getElementById("dsh-submenu-more");
            if (submenuMoreEl) submenuMoreEl.classList.remove("open");
          }

          // 点击空白区域关闭下拉框
          document.addEventListener("click", function(e) {
            closeAllDocDropdowns();
          });

          if (refreshBtn) {
            refreshBtn.addEventListener("click", function(e) {
              e.stopPropagation();
              loadWorkspaceAndFiles();
            });
          }

          var actRename = document.getElementById("dsh-act-rename");
          var actRenameText = document.getElementById("dsh-act-rename-text");

          function updateRenameMenuText() {
            if (actRenameText) {
              actRenameText.textContent = activeFilePath ? "重命名当前画板..." : "保存并命名画板到工作区...";
            }
          }

          if (actRename) {
            actRename.addEventListener("click", function(e) {
              e.stopPropagation();
              docDropdown.classList.remove("open");
              if (activeFilePath) {
                openModal("rename");
              } else {
                openModal("save_draft");
              }
            });
          }

          if (docBtn) {
            docBtn.addEventListener("dblclick", function(e) {
              e.stopPropagation();
              if (activeFilePath) {
                openModal("rename");
              } else {
                openModal("save_draft");
              }
            });
          }

          if (actNew) {
            actNew.addEventListener("click", function(e) {
              e.stopPropagation();
              closeAllDocDropdowns();
              openModal("new");
            });
          }

          // 二级子菜单交互与 Fixed 独立毛玻璃坐标系统
          var actMore = document.getElementById("dsh-act-more");
          var submenuMore = document.getElementById("dsh-submenu-more");
          var submenuTimer = null;

          function updateSubmenuPosition() {
            if (!actMore || !submenuMore) return;
            var rect = actMore.getBoundingClientRect();
            var submenuWidth = 228;
            var top = rect.top - 4;
            var left = rect.right + 4;

            // 若右侧越界（屏幕边缘不足），向左弹出
            if (left + submenuWidth > window.innerWidth - 8) {
              left = Math.max(8, rect.left - submenuWidth - 4);
            }
            if (submenuMore.offsetHeight && (top + submenuMore.offsetHeight > window.innerHeight - 8)) {
              top = Math.max(8, window.innerHeight - submenuMore.offsetHeight - 8);
            }

            submenuMore.style.top = top + "px";
            submenuMore.style.left = left + "px";
          }

          function openSubmenu() {
            if (submenuTimer) clearTimeout(submenuTimer);
            updateSubmenuPosition();
            if (submenuMore) submenuMore.classList.add("open");
            if (actMore) actMore.classList.add("dsh-submenu-active");
          }

          function closeSubmenu(immediate) {
            if (submenuTimer) clearTimeout(submenuTimer);
            if (immediate) {
              if (submenuMore) submenuMore.classList.remove("open");
              if (actMore) actMore.classList.remove("dsh-submenu-active");
            } else {
              submenuTimer = setTimeout(function() {
                if (submenuMore) submenuMore.classList.remove("open");
                if (actMore) actMore.classList.remove("dsh-submenu-active");
              }, 180);
            }
          }

          if (actMore && submenuMore) {
            actMore.addEventListener("mouseenter", function() {
              openSubmenu();
            });

            actMore.addEventListener("mouseleave", function() {
              closeSubmenu(false);
            });

            submenuMore.addEventListener("mouseenter", function() {
              if (submenuTimer) clearTimeout(submenuTimer);
            });

            submenuMore.addEventListener("mouseleave", function() {
              closeSubmenu(false);
            });

            actMore.addEventListener("click", function(e) {
              e.stopPropagation();
              if (submenuMore.classList.contains("open")) {
                closeSubmenu(true);
              } else {
                openSubmenu();
              }
            });
          }

          if (actSaveAs) {
            actSaveAs.addEventListener("click", function(e) {
              e.stopPropagation();
              closeAllDocDropdowns();
              openModal("saveas");
            });
          }

          if (actExport) {
            actExport.addEventListener("click", function(e) {
              e.stopPropagation();
              closeAllDocDropdowns();
              exportBoard();
            });
          }

          var actExportPng = document.getElementById("dsh-act-export-png");
          if (actExportPng) {
            actExportPng.addEventListener("click", function(e) {
              e.stopPropagation();
              closeAllDocDropdowns();
              if (typeof window.__dshExportPng === "function") {
                window.__dshExportPng();
              } else {
                alert("画板导出组件尚未就绪，请稍后重试");
              }
            });
          }

          var actExportSvg = document.getElementById("dsh-act-export-svg");
          if (actExportSvg) {
            actExportSvg.addEventListener("click", function(e) {
              e.stopPropagation();
              closeAllDocDropdowns();
              if (typeof window.__dshExportSvg === "function") {
                window.__dshExportSvg();
              } else {
                alert("画板导出组件尚未就绪，请稍后重试");
              }
            });
          }

          // 清空画布确认逻辑
          var actClear = document.getElementById("dsh-act-clear");
          var clearModal = document.getElementById("dsh-clear-modal-backdrop");
          var clearCancel = document.getElementById("dsh-clear-modal-cancel");
          var clearConfirm = document.getElementById("dsh-clear-modal-confirm");

          if (actClear) {
            actClear.addEventListener("click", function(e) {
              e.stopPropagation();
              closeAllDocDropdowns();
              if (clearModal) clearModal.classList.add("open");
            });
          }

          if (clearCancel) {
            clearCancel.addEventListener("click", function() {
              if (clearModal) clearModal.classList.remove("open");
            });
          }

          if (clearConfirm) {
            clearConfirm.addEventListener("click", function() {
              if (clearModal) clearModal.classList.remove("open");
              if (typeof window.__dshLoadBoardData === "function") {
                window.__dshLoadBoardData({ children: [], viewport: { zoom: 1 } });
                if (window.__dshOnCanvasChange) {
                  window.__dshOnCanvasChange({ children: [], viewport: { zoom: 1 } });
                }
              }
            });
          }

          // 删除画板确认与 API 调用逻辑
          var actDelete = document.getElementById("dsh-act-delete");
          var deleteModal = document.getElementById("dsh-delete-modal-backdrop");
          var deleteTargetName = document.getElementById("dsh-delete-target-name");
          var deleteCancel = document.getElementById("dsh-delete-modal-cancel");
          var deleteConfirm = document.getElementById("dsh-delete-modal-confirm");

          if (actDelete) {
            actDelete.addEventListener("click", function(e) {
              e.stopPropagation();
              closeAllDocDropdowns();
              if (!activeFilePath) {
                alert("当前画板尚未持久化保存为文件，无需删除");
                return;
              }
              var curDisplayName = (docTitle ? docTitle.textContent : "当前画板").trim();
              if (deleteTargetName) {
                deleteTargetName.textContent = "《" + curDisplayName + "》";
              }
              if (deleteModal) deleteModal.classList.add("open");
            });
          }

          if (deleteCancel) {
            deleteCancel.addEventListener("click", function() {
              if (deleteModal) deleteModal.classList.remove("open");
            });
          }

          if (deleteConfirm) {
            deleteConfirm.addEventListener("click", function() {
              if (!activeFilePath) {
                if (deleteModal) deleteModal.classList.remove("open");
                return;
              }
              var deletingPath = activeFilePath;
              deleteConfirm.disabled = true;
              deleteConfirm.textContent = "正在删除...";
              fetch("/drawnix/api/delete", {
                method: "POST",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ path: deletingPath })
              })
              .then(function(r) { return r.json(); })
              .then(function(data) {
                deleteConfirm.disabled = false;
                deleteConfirm.textContent = "确认删除";
                if (deleteModal) deleteModal.classList.remove("open");
                if (data && data.success) {
                  activeFilePath = null;
                  isFileLoaded = false;
                  pendingSavePath = null;
                  pendingSaveData = null;
                  loadWorkspaceAndFiles(function() {
                    if (fileList.length === 0) {
                      isFileLoaded = true;
                      if (docTitle) docTitle.textContent = "未命名白板";
                      if (docDot) {
                        docDot.className = "dsh-doc-status-dot offline";
                        docDot.title = "空白白板 (可点击新建或另存为持久化到工作区)";
                      }
                      if (typeof window.__dshLoadBoardData === "function") {
                        window.__dshLoadBoardData({ children: [], viewport: { zoom: 1 } });
                      }
                    }
                  });
                } else {
                  alert("删除画板失败: " + ((data && data.error) || "未知错误"));
                }
              })
              .catch(function(err) {
                deleteConfirm.disabled = false;
                deleteConfirm.textContent = "确认删除";
                alert("请求删除画板接口出错: " + err.message);
              });
            });
          }

          if (actImport) {
            actImport.addEventListener("click", function(e) {
              e.stopPropagation();
              closeAllDocDropdowns();
              fileInput.click();
            });
          }

          function handleImportFile(file) {
            if (!file) return;
            if (file.size === 0) {
              alert("【无法导入：文件内容为空 (0 字节)】\n\n原因分析：\n该文件在磁盘上大小为 0 Bytes。\n\n解决办法：\n1. 若该文件是从 Chrome 等浏览器下载的，Chrome 安全机制可能弹出了「此文件可能存在风险」拦截提示。请检查浏览器右上角下载列表（⬇️），点击「保留」确认下载；\n2. 确认浏览器下载完全落盘后再重新导入。");
              return;
            }
            var reader = new FileReader();
            reader.onload = function(evt) {
              try {
                var raw = (evt.target.result || "").trim();
                if (!raw) {
                  alert("【无法导入：文件内容为空】\n\n文件未读取到有效文本内容，请检查文件是否完整。");
                  return;
                }
                var json = JSON.parse(raw);
                if (Array.isArray(json)) {
                  json = { children: json };
                } else if (json && json.elements && !json.children) {
                  json.children = json.elements;
                }
                pendingImportData = json;
                openModal("import", file.name);
              } catch (err) {
                alert("【画板导入解析错误】\n\n无法解析该文件的 JSON 结构：" + err.message + "\n\n请确保选择的是有效的 .drawnix 或 .json 白板导出文件。");
              }
            };
            reader.onerror = function() {
              alert("读取文件失败，请检查文件访问权限。");
            };
            reader.readAsText(file);
          }

          if (fileInput) {
            fileInput.addEventListener("change", function(e) {
              var file = e.target.files && e.target.files[0];
              if (!file) return;
              handleImportFile(file);
              fileInput.value = "";
            });
          }

          // 支持从系统文件管理器直接拖拽 .drawnix 文件到窗口中快速导入
          window.addEventListener("dragover", function(e) {
            e.preventDefault();
            e.stopPropagation();
          });
          window.addEventListener("drop", function(e) {
            var dt = e.dataTransfer;
            var file = dt && dt.files && dt.files[0];
            if (!file) return;
            if (file.name.match(/\.(drawnix|json)$/i)) {
              e.preventDefault();
              e.stopPropagation();
              handleImportFile(file);
            }
          });

          // 弹窗按键交互
          if (modalCancel) modalCancel.addEventListener("click", closeModal);
          if (modalConfirm) modalConfirm.addEventListener("click", handleModalConfirm);
          if (modalInput) {
            modalInput.addEventListener("keydown", function(e) {
              if (e.key === "Enter") handleModalConfirm();
              if (e.key === "Escape") closeModal();
            });
          }

          // 启动时查询工作区及文件
          loadWorkspaceAndFiles(function() {
            // 如果已有选定的活动文件，确保文件内容已真正完成加载
            if (activeFilePath) {
              var foundCurrent = findInFileList(activeFilePath);
              var pathToLoad = foundCurrent ? foundCurrent.path : activeFilePath;
              if (!isFileLoaded) {
                selectFile(pathToLoad, true, true);
              } else {
                renderFileList();
              }
              return;
            }

            var tabStored = currentTabId ? localStorage.getItem("dsh_drawnix_tab_" + currentTabId) : null;
            var globalStored = localStorage.getItem("dsh_drawnix_active_file");
            var candidate = tabStored || globalStored;
            var found = findInFileList(candidate);
            if (found) {
              selectFile(found.path, true, true);
            } else if (fileList.length > 0) {
              selectFile(fileList[0].path, true, true);
            } else {
              activeFilePath = null;
              isFileLoaded = true;
              lastSavedJson = JSON.stringify({ children: [] });
              if (docTitle) docTitle.textContent = "未命名白板 (缓存)";
              if (docDot) {
                docDot.className = "dsh-doc-status-dot offline";
                docDot.title = "本地草稿缓存 (可点击新建或另存为持久化到工作区)";
              }
            }
          });
        }

        function announceReady() {
          // 向宿主宣告：消息监听与 selectFile 已就位，可以派发待打开文件
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({ type: "DSH_WHITEBOARD_READY" }, "*");
            }
          } catch (e) {}
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", function() {
            initApp();
            announceReady();
          });
        } else {
          initApp();
          announceReady();
        }

        // 监听宿主发送的外部打开指定画板命令（seq 令牌丢弃过期消息，修复连发竞态）
        window.addEventListener("message", function(event) {
          if (event.data && event.data.type === "DSH_OPEN_WHITEBOARD_FILE" && event.data.path) {
            var msgSeq = typeof event.data.seq === "number" ? event.data.seq : 0;
            if (msgSeq && msgSeq <= lastHandledOpenSeq) return;
            if (msgSeq) lastHandledOpenSeq = msgSeq;
            // 同一个文件正在加载中时，忽略重复的打开请求
            if (event.data.path === loadingFilePath) return;
            selectFile(event.data.path, true, true);
          }
        });

        // 监听 SSE 实时画板变更与外部唤起事件
        if (typeof EventSource !== "undefined") {
          try {
            var sseSource = new EventSource("/drawnix/api/events");
            sseSource.addEventListener("OPEN_BOARD", function(e) {
              try {
                // 仅刷新文件下拉清单，绝不篡改当前画板已打开的活动文档！
                loadWorkspaceAndFiles();
              } catch (err) {
                console.warn("[dsh-drawnix] webview sse error:", err);
              }
            });
          } catch (err) {}
        }
      })();
    </script>
  </body>
</html>
